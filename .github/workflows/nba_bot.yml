name: NBA Community Bot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  
jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install requests feedparser

      - run: python reddit_to_discussion.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: python twitter_fetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit tweet history
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add posted_tweets.txt
          git commit -m "update tweet history" || echo "no changes"
          git push

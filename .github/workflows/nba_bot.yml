name: NBA Community Bot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install requests

      - run: python reddit_to_discussion.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
